name: "Evidence Gate Action"
description: "Fail-closed CI checks that evidence files exist, are valid JSON, and meet thresholds (30 of 35 gate types locally). Blind Gate and the hosted API (Pro) are coming soon."
author: "evidence-gate"

branding:
  icon: shield
  color: blue

inputs:
  api_key:
    description: >-
      Evidence Gate API key. Optional — omit for Free mode (client-side
      evaluation, available now). Pro/Enterprise features (Blind Gate,
      Quality State, Remediation) need the hosted API (Pro), which is
      coming soon; API keys are not issued yet.
    required: false
    default: ""
  gate_type:
    description: "Gate type to evaluate (e.g., skill, xac, security). Can also be set in .evidencegate.yml config file."
    required: false
    default: ""
  phase_id:
    description: "Phase ID (e.g., 1a, 2b). Can also be set in .evidencegate.yml config file."
    required: false
    default: ""
  config_path:
    description: "Path to .evidencegate.yml config file. Defaults to GITHUB_WORKSPACE/.evidencegate.yml."
    required: false
    default: ""
  evidence_files:
    description: "Comma-separated list of evidence file paths"
    required: false
    default: ""
  api_base:
    description: "Evidence Gate API base URL, used only when api_key is set. The hosted API (Pro) at the default URL is coming soon and is not launched. A custom URL is accepted; Enterprise is not on sale"
    required: false
    default: "https://api.evidence-gate.dev"
  dashboard_base_url:
    description: "Supplemental dashboard base URL for run/evidence deep links"
    required: false
    default: ""
  evidence_url:
    description: "Explicit evidence deep link URL"
    required: false
    default: ""
  mode:
    description: "Enforcement mode: 'enforce' (default, fail on gate failure), 'warn' (emit warnings but step succeeds), or 'observe' (shadow mode, log results without blocking)"
    required: false
    default: "enforce"
  debug:
    description: "Enable verbose diagnostic output"
    required: false
    default: "false"
  version:
    description: "Deprecated / no-op. Kept for backward compatibility. The action always uses its bundled stdlib-only evaluator (no external evaluator package is installed)."
    required: false
    default: "latest"
  gate_preset:
    description: "Named gate bundle (web-app-baseline, enterprise-compliance, api-service, supply-chain). When set, runs all gates in the preset sequentially. Ignored when gate_type is also provided."
    required: false
    default: ""
  sticky_comment:
    description: "When true, aggregates results into a single updating PR comment. Requires pull-requests: write permission."
    required: false
    default: "false"

outputs:
  passed:
    description: "Gate result (true/false)"
    value: ${{ steps.evidence_gate.outputs.passed }}
  run_id:
    description: "Pipeline run ID"
    value: ${{ steps.evidence_gate.outputs.run_id }}
  trace_url:
    description: "Trace URL from a hosted evaluation response. Empty in Free mode. The hosted API (Pro) is coming soon and is not launched."
    value: ${{ steps.evidence_gate.outputs.trace_url }}
  evidence_url:
    description: "Evidence detail URL"
    value: ${{ steps.evidence_gate.outputs.evidence_url }}
  dashboard_url:
    description: "Supplemental dashboard URL"
    value: ${{ steps.evidence_gate.outputs.dashboard_url }}
  github_run_url:
    description: "GitHub Actions run URL"
    value: ${{ steps.evidence_gate.outputs.github_run_url }}
  major_issue_count:
    description: "Number of detected issues"
    value: ${{ steps.evidence_gate.outputs.major_issue_count }}
  mode:
    description: "Detected operational mode: free, pro, or enterprise"
    value: ${{ steps.evidence_gate.outputs.mode }}
  observe_would_pass:
    description: "In observe mode, whether the gate would have passed (true/false). Only set when mode input is 'observe'."
    value: ${{ steps.evidence_gate.outputs.observe_would_pass }}
  missing_evidence:
    description: "JSON array of missing evidence items [{code, message, field_path}]"
    value: ${{ steps.evidence_gate.outputs.missing_evidence }}
  suggested_actions:
    description: "Human-readable repair steps for failed gates"
    value: ${{ steps.evidence_gate.outputs.suggested_actions }}
  retry_prompt:
    description: "Machine-readable remediation instructions for AI agent auto-repair. Empty string when gate passed. Format: GATE/PHASE/STATUS/ISSUES/REMEDIATION/RETRY sections."
    value: ${{ steps.evidence_gate.outputs.retry_prompt }}
  json_output:
    description: "Full evaluation result as JSON string (use fromJson() to parse)"
    value: ${{ steps.evidence_gate.outputs.json_output }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pyyaml
      shell: bash
      run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3"

    - name: Run Evidence Gate
      id: evidence_gate
      shell: bash
      env:
        EG_API_KEY: ${{ inputs.api_key }}
        EG_API_BASE: ${{ inputs.api_base }}
        EG_MODE: ${{ inputs.mode }}
        EG_GATE_TYPE: ${{ inputs.gate_type }}
        EG_PHASE_ID: ${{ inputs.phase_id }}
        EG_EVIDENCE_FILES: ${{ inputs.evidence_files }}
        EG_DASHBOARD_BASE_URL: ${{ inputs.dashboard_base_url }}
        EG_EVIDENCE_URL: ${{ inputs.evidence_url }}
        EG_RUN_ID: ${{ github.run_id }}
        EG_DEBUG: ${{ inputs.debug }}
        EG_VERSION: ${{ inputs.version }}
        EG_GATE_PRESET: ${{ inputs.gate_preset }}
        EG_STICKY_COMMENT: ${{ inputs.sticky_comment }}
        EG_CONFIG_PATH: ${{ inputs.config_path }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python "$GITHUB_ACTION_PATH/src/entrypoint.py"
